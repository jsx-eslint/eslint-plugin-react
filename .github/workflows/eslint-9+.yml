name: 'Tests: ESLint (9+)'

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.requireds }}
      minors: ${{ steps.set-matrix.outputs.optionals }}
    steps:
      - uses: ljharb/actions/node/matrix@main
        id: set-matrix
        with:
          versionsAsRoot: true
          type: majors
          preset: '>=18'

  latest:
    needs: [matrix]
    name: 'latest majors'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.matrix.outputs.latest) }}
        eslint:
          - 10
          - 9
        babel-eslint:
          - 10
          - 9
          - 8
        typescript-eslint:
          - 8
        exclude:
          # ESLint 10 supports Node.js ^20.19.0 || ^22.13.0 || >=24
          - eslint: 10
            node-version: 18
          - eslint: 10
            node-version: 19
          - eslint: 10
            node-version: 21
          - eslint: 10
            node-version: 23
          - eslint: 10
            babel-eslint: 8

    steps:
      - uses: actions/checkout@v4
      - name: strip eslint-doc-generator and typescript to avoid peer conflicts
        run: jq 'del(.devDependencies["eslint-doc-generator"], .devDependencies["typescript"])' package.json > package.json.tmp && mv package.json.tmp package.json
      - uses: ljharb/actions/node/install@main
        name: 'nvm install ${{ matrix.node-version }} && npm install'
        with:
          node-version: ${{ matrix.node-version }}
          after_install: |
            npm install --no-save "eslint@${{ matrix.eslint }}" "@typescript-eslint/parser@${{ matrix.typescript-eslint == 8 && '8.17' || matrix.typescript-eslint }}" "babel-eslint@${{ matrix.babel-eslint }}" "typescript@5" --legacy-peer-deps
          skip-ls-check: true
      - run: npx ls-engines
      - run: npm run unit-test
      - uses: codecov/codecov-action@v3.1.5

  node:
    name: 'eslint 9+'
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - run: true
