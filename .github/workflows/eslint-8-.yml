name: 'Tests: ESLint (8-)'

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.requireds }}
      minors: ${{ steps.set-matrix.outputs.optionals }}
    steps:
      - uses: ljharb/actions/node/matrix@main
        id: set-matrix
        with:
          versionsAsRoot: true
          type: majors
          preset: '>=18'

  latest:
    needs: [matrix]
    name: 'latest majors'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.matrix.outputs.latest) }}
        eslint:
          - 8
          - 7
          - 6
          - 5
        babel-eslint:
          - 10
          - 9
          - 8
        typescript-eslint:
          - 5
          - 6
          - 7
          - 8
        exclude:
          - eslint: 5
            typescript-eslint: 5
          - eslint: 5
            typescript-eslint: 6
          - eslint: 6
            typescript-eslint: 6
          - eslint: 5
            typescript-eslint: 7
          - eslint: 6
            typescript-eslint: 7
          - eslint: 7
            typescript-eslint: 7
          - eslint: 5
            typescript-eslint: 8
          - eslint: 6
            typescript-eslint: 8
          - eslint: 7
            typescript-eslint: 8
          - node-version: 19
            typescript-eslint: 7

    steps:
      - uses: actions/checkout@v4
      - name: strip eslint-doc-generator to avoid peer conflicts
        if: ${{ matrix.typescript-eslint >= 6 }}
        run: echo "$(jq 'del(.devDependencies["eslint-doc-generator"])' package.json)" > package.json
      - uses: ljharb/actions/node/install@main
        name: 'nvm install ${{ matrix.node-version }} && npm install'
        with:
          node-version: ${{ matrix.node-version }}
          skip-ls-check: true
          after_install: |
            npm install --no-save "eslint@${{ matrix.eslint }}" "@typescript-eslint/parser@${{ matrix.typescript-eslint == 8 && 8.17 || matrix.typescript-eslint }}" "babel-eslint@${{ matrix.babel-eslint }}" ${{ matrix.typescript-eslint >= 6 && '"typescript@5"' || '' }}
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      - run: npx ls-engines
      - run: npm run unit-test
      - uses: codecov/codecov-action@v3.1.5

  node:
    name: 'eslint 8-'
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - run: true
