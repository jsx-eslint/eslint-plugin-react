name: 'CI: lint & build'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      # to push the `pnpm lint:fix` / `pnpm update:eslint-docs` result to the PR branch
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check out the PR branch itself (not the merge commit) so that the fix can be pushed back
          ref: ${{ github.head_ref || github.ref_name }}
          show-progress: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:fix
      # regenerate the rule docs and the rules list in README.md from the rules' meta
      - run: pnpm update:eslint-docs

      - name: commit the `pnpm lint:fix` / `pnpm update:eslint-docs` result
        # only for PRs from this repository: the token can not push to forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message 'chore: apply `pnpm lint:fix` and `pnpm update:eslint-docs`'
          git push

      - name: check that there is nothing left for `pnpm lint:fix` / `pnpm update:eslint-docs`
        run: git diff --exit-code

      # markdownlint, eslint-doc-generator --check, eslint and tsc
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the `engines` of this package must be satisfiable by all its dependencies
      - run: pnpm exec ls-engines
      # `prepack` builds the type declarations
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: show the package contents
        run: tar -tzf "$RUNNER_TEMP"/*.tgz

  changeset:
    # every PR needs a changeset (`pnpm changeset`, or `pnpm changeset --empty` for changes without a release note)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset status --since` compares with the base branch
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since="origin/${{ github.base_ref }}"
